# ==========================================
# Native .env file import (Spring Boot 2.4+)
# ==========================================
spring.config.import=optional:file:.env[.properties]

# ==========================================
# Application General Settings
# ==========================================
spring.application.name=${APP_NAME:BlogApi}
server.port=${SERVER_PORT:8080}

# ==========================================
# Database Configuration (H2 Embedded Database)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:blogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

# ==========================================
# H2 Web Console (Browser UI)
# ==========================================
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${H2_CONSOLE_PATH:/h2-console}
